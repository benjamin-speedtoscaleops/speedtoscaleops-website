<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upwork banner — Speed To Scale Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html { zoom: 2; }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 160px; overflow: hidden; position: relative;
    background: #f5f0e2;
    background-image:
      linear-gradient(rgba(22,21,19,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,21,19,.05) 1px, transparent 1px);
    background-size: 34px 34px;
    color: #161513;
    border-top: 5px solid #161513;
    border-bottom: 5px solid #161513;
  }
  .chip {
    position: absolute; top: 14px; left: 150px;
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500;
    letter-spacing: .08em;
    background: #fffdf6; border: 1.5px solid #161513; border-radius: 999px;
    padding: 3px 14px;
    box-shadow: 3px 3px 0 #2b4bc0;
  }
  .wrap {
    position: absolute; left: 450px; right: 170px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 6px;
  }
  h1 {
    font-family: "Anton", "Arial Narrow", sans-serif; font-weight: 400;
    font-size: 45px; line-height: 1; letter-spacing: .01em;
    text-transform: uppercase; white-space: nowrap;
  }
  .hl {
    background: linear-gradient(104deg, transparent 2%, #58e07a 3%, #58e07a 97%, transparent 98%);
    padding: 0 6px;
  }
  .scribble {
    font-family: "Caveat", cursive; font-weight: 600; font-size: 30px;
    color: #2b4bc0; transform: rotate(-2deg); align-self: flex-end; margin-right: 40px;
  }
  .tile {
    position: absolute; right: 48px; top: 50%;
    width: 86px; height: 86px; transform: translateY(-50%) rotate(2deg);
    background: #d9f4e0; border: 2px solid #161513; border-radius: 10px;
    box-shadow: 4px 4px 0 #2b4bc0;
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 58px; height: 58px; fill: #58e07a; stroke: #161513; stroke-width: 1.2; }
</style>
</head>
<body>
  <span class="chip">OPERATIONS, NOT MARKETING</span>
  <div class="wrap">
    <h1>You already get leads. We turn them into <span class="hl">revenue</span>.</h1>
    <span class="scribble">every new lead answered in 60 seconds</span>
  </div>
  <div class="tile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2 6.5 13h4.5L9 22l8.5-11H13l1-9z"/></svg>
  </div>
</body>
</html>
